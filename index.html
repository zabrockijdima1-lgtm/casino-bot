<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>🚀 Rocket Casino</title>

<!-- Telegram WebApp API -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- Import Map для ESM модулів -->
<script type="importmap">
{
  "imports": {
    "@tonconnect/ui": "https://esm.sh/@tonconnect/ui@2.0.9"
  }
}
</script>

<style>
body {
  margin: 0;
  padding: 20px;
  background: #0a0f1a;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}
button {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  border: none;
  padding: 15px 30px;
  border-radius: 10px;
  font-size: 16px;
  cursor: pointer;
  margin: 10px;
}
#status {
  padding: 20px;
  background: rgba(255,255,255,0.1);
  border-radius: 10px;
  margin: 20px 0;
}
</style>
</head>
<body>
  <h1>🎰 Casino Bot</h1>
  
  <div id="status">
    ⏳ Initializing TON Connect...
  </div>
  
  <button id="connectBtn" onclick="connectWallet()" disabled>
    🔗 Connect Wallet
  </button>
  
  <div id="walletInfo" style="display:none; margin-top: 20px;"></div>

  <script type="module">
    import { TonConnectUI } from '@tonconnect/ui';
    
    let tonConnectUI = null;
    let isConnected = false;
    
    // Ініціалізація
    async function init() {
      try {
        const tg = window.Telegram?.WebApp;
        
        if(tg) {
          console.log('✅ Telegram WebApp detected');
          tg.ready();
          tg.expand();
        }
        
        document.getElementById('status').textContent = '🔄 Loading TON Connect...';
        
        // Створюємо TonConnect UI
        tonConnectUI = new TonConnectUI({
          manifestUrl: 'https://raw.githubusercontent.com/zabrockijdima1-lgtm/casino-bot/main/tonconnect-manifest.json'
        });
        
        console.log('✅ TON Connect UI created');
        
        // Слухаємо зміни статусу
        tonConnectUI.onStatusChange(wallet => {
          updateUI(!!wallet, wallet);
        });
        
        // Перевіряємо поточний статус
        const currentWallet = tonConnectUI.wallet;
        updateUI(!!currentWallet, currentWallet);
        
        document.getElementById('connectBtn').disabled = false;
        document.getElementById('status').textContent = '✅ TON Connect Ready!';
        
        console.log('✅ Initialization complete');
        
        // Експортуємо функції глобально
        window.tonConnectUI = tonConnectUI;
        window.connectWallet = connectWallet;
        window.disconnectWallet = disconnectWallet;
        
      } catch (error) {
        console.error('❌ Init error:', error);
        document.getElementById('status').textContent = '❌ Error: ' + error.message;
      }
    }
    
    function updateUI(connected, wallet) {
      const status = document.getElementById('status');
      const btn = document.getElementById('connectBtn');
      const info = document.getElementById('walletInfo');
      
      isConnected = connected;
      
      if (connected && wallet) {
        status.textContent = '✅ Wallet Connected!';
        btn.textContent = '🔌 Disconnect';
        btn.onclick = disconnectWallet;
        
        info.style.display = 'block';
        info.innerHTML = `
          <div style="background: rgba(255,255,255,0.05); padding: 15px; border-radius: 10px;">
            <h3>📱 Wallet Info:</h3>
            <p><strong>Address:</strong> ${wallet.account.address}</p>
            <p><strong>Chain:</strong> ${wallet.account.chain}</p>
          </div>
        `;
        
        console.log('✅ Connected:', wallet.account.address);
      } else {
        status.textContent = '❌ Wallet Not Connected';
        btn.textContent = '🔗 Connect Wallet';
        btn.onclick = connectWallet;
        info.style.display = 'none';
      }
    }
    
    async function connectWallet() {
      try {
        if (!tonConnectUI) {
          alert('TON Connect not initialized');
          return;
        }
        
        console.log('Opening modal...');
        document.getElementById('status').textContent = '🔄 Opening wallet...';
        
        await tonConnectUI.openModal();
        
      } catch (error) {
        console.error('❌ Connect error:', error);
        document.getElementById('status').textContent = '❌ Connection failed: ' + error.message;
      }
    }
    
    async function disconnectWallet() {
      try {
        if (!tonConnectUI) return;
        
        console.log('Disconnecting...');
        await tonConnectUI.disconnect();
        
      } catch (error) {
        console.error('❌ Disconnect error:', error);
      }
    }
    
    // Запуск
    window.addEventListener('load', init);
  </script>
</body>
</html>
